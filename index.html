<!DOCTYPE html>
<html lang="hi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vibe with Me</title>
  <meta name="description" content="Vibe with Me — A cinematic, illustrated Indian-street-inspired music player." />

  <!-- Open Graph / Social Link Previews (Discord, WhatsApp, Telegram, etc.) -->
  <meta property="og:title" content="Vibe with Me" />
  <meta property="og:description" content="A cinematic, illustrated Indian-street-inspired YouTube playlist player." />
  <meta property="og:image" content="https://www.vibewithme.live/assets/favicon/web-app-manifest-512x512.png" />
  <meta property="og:image:secure_url" content="https://www.vibewithme.live/assets/favicon/web-app-manifest-512x512.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />
  <meta property="og:url" content="https://www.vibewithme.live/" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Vibe with Me" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Vibe with Me" />
  <meta name="twitter:description" content="A cinematic, illustrated Indian-street-inspired YouTube playlist player." />
  <meta name="twitter:image" content="https://www.vibewithme.live/assets/favicon/web-app-manifest-512x512.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Noto+Serif+Devanagari:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="icon" href="assets/favicon.webp" type="image/webp" />
  <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="assets/favicon/favicon-96x96.png" sizes="96x96" type="image/png" />
  <link rel="icon" href="assets/favicon/favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="assets/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- ============================================================
       BACKGROUND LAYER
  ============================================================= -->
  <div class="bg-layer" aria-hidden="true">
    <div class="bg-illustration" id="bgIllustration">
      <svg class="skyline-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice"
        xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#5c1f1a" />
            <stop offset="45%" stop-color="#9c3a26" />
            <stop offset="75%" stop-color="#c9622f" />
            <stop offset="100%" stop-color="#e39a4a" />
          </linearGradient>
          <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffe9c2" stop-opacity="0.95" />
            <stop offset="45%" stop-color="#f3b25a" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#f3b25a" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="rowFar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3a1512" />
            <stop offset="100%" stop-color="#2b0f0d" />
          </linearGradient>
          <linearGradient id="rowMid" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#26100d" />
            <stop offset="100%" stop-color="#1c0b09" />
          </linearGradient>
          <linearGradient id="rowNear" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#160908" />
            <stop offset="100%" stop-color="#0f0605" />
          </linearGradient>
        </defs>

        <rect x="0" y="0" width="1600" height="900" fill="url(#skyGrad)" />
        <circle cx="800" cy="430" r="320" fill="url(#sunGlow)" />
        <circle cx="800" cy="430" r="120" fill="#ffedd0" opacity="0.9" />

        <g class="birds" stroke="#2b0f0d" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.55">
          <path d="M300 220 q14 -16 28 0 q14 -16 28 0" />
          <path d="M370 260 q10 -12 20 0 q10 -12 20 0" />
          <path d="M1180 200 q12 -14 24 0 q12 -14 24 0" />
        </g>

        <g id="rowFarBuildings" fill="url(#rowFar)"></g>
        <g id="rowMidBuildings" fill="url(#rowMid)"></g>
        <g id="rowNearBuildings" fill="url(#rowNear)"></g>

        <g class="string-lights" fill="none" stroke="#3a1512" stroke-width="3" opacity="0.8">
          <path d="M0 90 Q 400 210 800 100 T 1600 95" />
        </g>
        <g class="string-bulbs" fill="#ffd98a"></g>
      </svg>
    </div>

    <div class="bg-photo" id="bgPhoto"></div>
    <div class="bg-photo bg-photo--mobile" id="bgPhotoMobile"></div>
    <div class="bg-photo bg-photo--dynamic" id="bgPhotoDynamic"></div>
    <div class="bg-overlay"></div>
    <div class="bg-grain"></div>

    <!-- Rain effect — populated with falling drop elements by script.js,
         shown only when live weather conditions indicate rain/drizzle/storm. -->
    <div class="rain-layer" id="rainLayer" aria-hidden="true"></div>
  </div>

  <!-- ============================================================
       TOP-LEFT: WEATHER + CLOCK
  ============================================================= -->
  <div class="top-left-pill" id="weatherPill">
    <span class="clock" id="clock"></span>
    <span class="weather-chip" id="weatherChip" aria-hidden="true">
      <span class="weather-icon" id="weatherIcon">⛅</span>
    </span>
    <button class="location-chip" id="locationChip" aria-haspopup="true" aria-expanded="false"
      aria-controls="locationSearchPanel" title="Change weather location">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path
          d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z" />
      </svg>
      <span id="locationName">Manali</span>
    </button>
  </div>

  <!-- ============================================================
       LOCATION SEARCH — pick weather for any place
  ============================================================= -->
  <div class="location-search-backdrop" id="locationSearchBackdrop"></div>
  <div class="location-search-panel" id="locationSearchPanel" aria-hidden="true">
    <div class="location-search-header">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      <input type="text" id="locationSearchInput" class="location-search-input" placeholder="Search for a city…"
        autocomplete="off" spellcheck="false" />
      <button class="location-search-close" id="locationSearchClose" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="m6.4 5 12.6 12.6-1.4 1.4L5 6.4 6.4 5Zm12.6 1.4L6.4 19 5 17.6 17.6 5 19 6.4Z" />
        </svg>
      </button>
    </div>
    <ul class="location-search-results" id="locationSearchResults"></ul>
  </div>

  <!-- ============================================================
       LEFT SIDEBAR: PLAYLIST SELECTOR
  ============================================================= -->
  <!-- Backdrop: closes sidebar when clicked -->
  <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>

  <!-- Sidebar panel -->
  <nav class="playlist-sidebar" id="playlistSidebar" aria-label="Playlist selector">
    <!-- Toggle tab (always visible on left edge) -->
    <button class="sidebar-toggle" id="sidebarToggle" aria-label="Open playlist menu"
      aria-expanded="false" aria-controls="sidebarList">
      <span class="sidebar-toggle-lines" aria-hidden="true">
        <span></span><span></span><span></span>
      </span>
      <span class="sidebar-toggle-label">Playlists</span>
    </button>

    <!-- Scrollable list (built by initSidebar() in script.js) -->
    <div class="sidebar-inner">
      <p class="sidebar-heading">Playlists</p>
      <ul class="sidebar-list" id="sidebarList" role="list"></ul>
    </div>
  </nav>

  <!-- ============================================================
       TOP-RIGHT: LIKE + ONLINE + SOCIAL LINKS
  ============================================================= -->
  <nav class="service-nav" aria-label="Playlist and social links">
    <button class="like-pill" id="likeBtn" aria-label="Like this playlist" aria-pressed="false"
      title="Like this playlist">
      <svg id="heartIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        aria-hidden="true">
        <path
          d="M12 20.5s-7.5-4.6-10-9.3C.5 7.8 2.3 4.5 5.7 4c2-.3 3.9.6 5 2.2 1.1-1.6 3-2.5 5-2.2 3.4.5 5.2 3.8 3.7 7.2-2.5 4.7-10 9.3-10 9.3Z" />
      </svg>
      <span id="likeCount">0</span>
    </button>

    <span class="online-pill" id="onlinePill">
      <span class="online-dot" aria-hidden="true"></span>
      <span><span id="onlineCount">30</span> online</span>
    </span>

    <a class="nav-service-link" id="ytMusicLink" href="#" target="_blank" rel="noopener noreferrer"
      aria-label="Open on YT Music (new tab)" title="YT Music">
      <svg class="nav-service-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" fill="none" />
        <circle cx="12" cy="12" r="6" stroke="currentColor" stroke-width="1.6" fill="none" />
        <polygon points="10,8.5 16,12 10,15.5" fill="currentColor" />
      </svg>
      <span>YT Music</span>
      <svg class="nav-service-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="7" y1="17" x2="17" y2="7"></line>
        <polyline points="7 7 17 7 17 17"></polyline>
      </svg>
    </a>
    <a class="nav-service-link" id="instagramLink" href="#" target="_blank" rel="noopener noreferrer"
      aria-label="Open Instagram (new tab)" title="Instagram">
      <svg class="nav-service-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
      </svg>
      <span>Instagram</span>
      <svg class="nav-service-arrow" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="7" y1="17" x2="17" y2="7"></line>
        <polyline points="7 7 17 7 17 17"></polyline>
      </svg>
    </a>
  </nav>

  <!-- ============================================================
       CENTRAL HERO TITLE
  ============================================================= -->
  <div class="hero-title" id="heroTitle" aria-hidden="true">
    <img src="assets/bg-text.webp" alt="Hero Title" class="hero-title-img" />
  </div>

  <!-- ============================================================
       STATUS / LOADING / ERROR BANNER
  ============================================================= -->
  <div class="status-banner" id="statusBanner" role="status" aria-live="polite"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- ============================================================
       YOUTUBE PLAYER — functional, visually hidden
  ============================================================= -->
  <div class="yt-hidden" aria-hidden="true">
    <div id="youtube-player"></div>
  </div>

  <!-- ============================================================
       FLOATING PLAYER ISLAND
  ============================================================= -->
  <section class="player" id="player" aria-label="Music player">
    <div class="player-art-wrap" id="artSwipeArea">
      <div class="player-art-ring">
        <img class="player-art" id="albumArt" src="" alt="" draggable="false" />
        <div class="player-art-center" aria-hidden="true"></div>
      </div>
      <button class="swipe-hint swipe-hint--left" id="swipeHintLeft" aria-hidden="true" tabindex="-1">‹</button>
      <button class="swipe-hint swipe-hint--right" id="swipeHintRight" aria-hidden="true" tabindex="-1">›</button>
    </div>

    <div class="player-body">
      <div class="track-meta">
        <p class="track-title" id="trackTitle">Loading playlist…</p>
        <p class="track-artist" id="trackArtist">Please wait</p>
      </div>

      <div class="progress-row">
        <div class="progress-track" id="progressTrack" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0"
          aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill-mask" id="progressFillMask"></div>
          <div class="progress-handle" id="progressHandle"></div>
        </div>
      </div>

      <div class="time-row">
        <span class="time-label" id="currentTime">0:00</span>
        <span class="time-divider">/</span>
        <span class="time-label" id="durationTime">0:00</span>
      </div>
    </div>

    <div class="player-controls">
      <button class="ctrl-btn" id="prevBtn" aria-label="Previous track" title="Previous">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6 6h2v12H6V6Zm3.5 6 10-6v12l-10-6Z" />
        </svg>
      </button>

      <button class="play-btn" id="playBtn" aria-label="Play" title="Play">
        <svg id="iconPlay" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8 5v14l12-7L8 5Z" />
        </svg>
        <svg id="iconPause" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"
          style="display:none">
          <path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z" />
        </svg>
      </button>

      <button class="ctrl-btn" id="nextBtn" aria-label="Next track" title="Next">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M16 6h2v12h-2V6Zm-2 6-10 6V6l10 6Z" />
        </svg>
      </button>

      <button class="ctrl-btn shuffle-btn" id="shuffleBtn" aria-label="Shuffle off" title="Shuffle"
        aria-pressed="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M4 6h3.5l7 12H18v-2.5l4 3.5-4 3.5V20h-4.5l-7-12H4V6Zm10.5 0H18V3.5L22 7l-4 3.5V8h-2.5l-2-3.5 1.3-2.3L14.5 6Z" />
        </svg>
      </button>

      <button class="ctrl-btn queue-btn" id="queueBtn" aria-label="Show queue" title="Queue" aria-expanded="false"
        aria-controls="queuePanel">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M4 6h11v2H4V6Zm0 5h11v2H4v-2Zm0 5h7v2H4v-2Zm13.5-8L22 12l-4.5 4V8Z" />
        </svg>
      </button>
    </div>
  </section>

  <!-- ============================================================
       QUEUE DRAWER
  ============================================================= -->
  <div class="queue-backdrop" id="queueBackdrop"></div>
  <section class="queue-panel" id="queuePanel" aria-label="Song queue" aria-hidden="true">
    <div class="queue-handle" id="queueHandle" aria-hidden="true"></div>
    <div class="queue-header">
      <h2 class="queue-title">Up next</h2>
      <button class="queue-close" id="queueCloseBtn" aria-label="Close queue">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="m6.4 5 12.6 12.6-1.4 1.4L5 6.4 6.4 5Zm12.6 1.4L6.4 19 5 17.6 17.6 5 19 6.4Z" />
        </svg>
      </button>
    </div>
    <div class="queue-search-row">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3.5-3.5" />
      </svg>
      <input type="text" id="queueSearchInput" class="queue-search-input"
        placeholder="Search by song, artist, or movie…" autocomplete="off" spellcheck="false" />
      <button class="queue-search-clear" id="queueSearchClear" aria-label="Clear search" style="display:none">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="m6.4 5 12.6 12.6-1.4 1.4L5 6.4 6.4 5Zm12.6 1.4L6.4 19 5 17.6 17.6 5 19 6.4Z" />
        </svg>
      </button>
    </div>
    <p class="queue-search-empty" id="queueSearchEmpty" style="display:none">No songs match your search.</p>
    <ul class="queue-list" id="queueList" role="list"></ul>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>

</html>
